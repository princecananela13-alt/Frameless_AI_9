name: Build Frameless_AI APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Frameless_AI_APK_project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: Frameless_AI_APK
      - run: |
          cp Frameless_AI_APK/app/build/outputs/apk/debug/app-debug.apk Frameless_AI.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Frameless_AI.apk
          git commit -m "Add built APK"
          git push
